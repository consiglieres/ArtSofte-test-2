<button class="item" (click)="onCompanyClick()">
  <section class="item_logo">
    <img [src]="getLogo()" />
  </section>
  <section class="item_information">
    <h3 class="item_infaormation_buisness-name">
      Наименование: {{ company.business_name }}
    </h3>
    <p class="item_information_industry">
      Отрасль деятельности: {{ company.industry }}
    </p>
    <p class="item_information_tupe">Тип: {{ company.type }}</p>
  </section>
</button>
